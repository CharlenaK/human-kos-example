<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Human KOS Example — Interactive 2D Knowledge World Map and Personal Bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f8f6"/>
      <stop offset="100%" stop-color="#efefec"/>
    </linearGradient>
  </defs>
  <rect width="880" height="220" rx="16" fill="url(#bg)" stroke="#d7d7d4" stroke-width="1.5"/>
  <!-- Subtle Voronoi lines -->
  <g stroke="#d7d7d4" stroke-width="1" fill="none" opacity="0.75">
    <polygon points="560,20 710,30 740,120 620,145 530,90" fill="#2563eb" fill-opacity="0.06"/>
    <polygon points="710,30 855,40 850,150 740,120" fill="#059669" fill-opacity="0.06"/>
    <polygon points="620,145 740,120 850,150 790,202 605,198" fill="#7c3aed" fill-opacity="0.06"/>
    <polygon points="530,90 620,145 605,198 510,185" fill="#d97706" fill-opacity="0.06"/>
  </g>
  <!-- Connected sample nodes across 5 orthogonal facets -->
  <g stroke="#737373" stroke-width="1.2" opacity="0.45">
    <line x1="615" y1="84" x2="732" y2="82"/>
    <line x1="615" y1="84" x2="682" y2="152"/>
    <line x1="732" y1="82" x2="785" y2="128"/>
    <line x1="682" y1="152" x2="575" y2="156"/>
    <line x1="682" y1="152" x2="785" y2="128"/>
  </g>
  <circle cx="615" cy="84" r="9" fill="#2563eb"/>
  <circle cx="732" cy="82" r="8" fill="#059669"/>
  <circle cx="682" cy="152" r="9" fill="#7c3aed"/>
  <circle cx="575" cy="156" r="7.5" fill="#d97706"/>
  <circle cx="785" cy="128" r="7.5" fill="#0891b2"/>
  <!-- Title & Subtitle -->
  <text x="48" y="84" font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#262626">Human KOS Example</text>
  <text x="48" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#525252">Explore 84,552 Concepts on a 2D World Map &amp; Connect Your AI Chats Offline</text>
  <!-- 5 Facet Identity Swatches -->
  <g transform="translate(48, 152)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#2563eb"/>
    <text x="16" y="9" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#525252">Domain</text>
    <rect x="78" y="0" width="10" height="10" rx="2" fill="#059669"/>
    <text x="94" y="9" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#525252">Activity</text>
    <rect x="156" y="0" width="10" height="10" rx="2" fill="#7c3aed"/>
    <text x="172" y="9" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#525252">Process</text>
    <rect x="236" y="0" width="10" height="10" rx="2" fill="#d97706"/>
    <text x="252" y="9" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#525252">Artifact</text>
    <rect x="314" y="0" width="10" height="10" rx="2" fill="#0891b2"/>
    <text x="330" y="9" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#525252">Stance</text>
  </g>
</svg>
